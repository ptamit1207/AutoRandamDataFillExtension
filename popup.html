<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font: 14px system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }

    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: #22c55e;
      color: #052e16;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #4ade80;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 8px;
      font-size: 13px;
    }

    #status {
      min-height: 18px;
      font-size: 12px;
      color: #94a3b8;
    }

    small {
      color: #64748b;
    }
  </style>
</head>

<body>
  <h1>Auto Form Filler</h1>
  <button id="fill">Fill Form (random data)</button>
  <label><input type="checkbox" id="overwrite" checked> Already filled fields bhi overwrite karo</label>
  <div id="status"></div>
  <small>Shortcut: Alt+Shift+F</small>
  <script src="popup.js"></script>
</body>

</html>
